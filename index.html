<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
html, body {
  margin: 0; padding: 0; height: 100%;
  background: #172a1f; color: #efe9de;
  font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: rgba(0,0,0,0);
  overflow: hidden;
}
* { box-sizing: border-box; -webkit-box-sizing: border-box; }

#app {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  padding: 26px 30px;
  display: -webkit-box; display: -webkit-flex; display: flex;
  -webkit-box-orient: horizontal; -webkit-flex-direction: row; flex-direction: row;
}
.col { display: -webkit-box; display: -webkit-flex; display: flex;
  -webkit-box-orient: vertical; -webkit-flex-direction: column; flex-direction: column;
  min-width: 0; }
#left  { -webkit-box-flex: 13; -webkit-flex: 13 1 0; flex: 13 1 0; }
#right { -webkit-box-flex: 10; -webkit-flex: 10 1 0; flex: 10 1 0; margin-left: 26px; }

/* Uhr */
#clock {
  font-size: 186px; font-weight: 200; line-height: 0.92;
  letter-spacing: -7px; margin-left: -8px;
  -webkit-font-feature-settings: "tnum"; font-feature-settings: "tnum";
  white-space: nowrap;
}
#date { font-size: 30px; font-weight: 300; color: #b8bfae; margin-top: 10px; }
#date b { color: #efe9de; font-weight: 500; }

/* Karten */
.card {
  background: #20372a; border-radius: 18px; padding: 20px 24px;
  border: 1px solid #2c4636;
}
.label {
  font-size: 12px; font-weight: 600; letter-spacing: 2px;
  text-transform: uppercase; color: #c99a5f; margin-bottom: 12px;
}
.grow { -webkit-box-flex: 1; -webkit-flex: 1 1 auto; flex: 1 1 auto; }

/* Zitat */
#quoteCard { margin-top: auto; }
#quoteText { font-size: 25px; line-height: 1.35; font-weight: 300; }
#quoteText.long { font-size: 21px; }
#quoteText.xlong { font-size: 19px; }
#quoteBy { margin-top: 12px; font-size: 16px; color: #c99a5f; font-weight: 500; }
#quoteBy span { color: #8a9a88; font-weight: 400; }

/* Wort des Tages */
#word { font-size: 40px; font-weight: 600; line-height: 1.1; letter-spacing: -0.5px;
  word-wrap: break-word; }
#wordType { font-size: 15px; color: #8a9a88; font-style: italic; margin-top: 4px; }
#wordMeaning { font-size: 19px; line-height: 1.4; margin-top: 12px; }
#wordExample { font-size: 16px; line-height: 1.45; margin-top: 12px; color: #b8bfae;
  font-style: italic; border-left: 2px solid #c99a5f; padding-left: 12px; }

/* To-dos */
#todoCard { margin-top: 18px; overflow: hidden;
  display: -webkit-box; display: -webkit-flex; display: flex;
  -webkit-box-orient: vertical; -webkit-flex-direction: column; flex-direction: column; }
#todoList { list-style: none; margin: 0; padding: 0; overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  -webkit-box-flex: 1; -webkit-flex: 1 1 auto; flex: 1 1 auto; }
#todoList li { font-size: 19px; line-height: 1.3; padding: 9px 0;
  border-bottom: 1px solid #2c4636;
  display: -webkit-box; display: -webkit-flex; display: flex;
  -webkit-box-align: center; -webkit-align-items: center; align-items: center; }
#todoList li:last-child { border-bottom: 0; }
.dot { width: 20px; height: 20px; border-radius: 10px; border: 2px solid #566955;
  margin-right: 12px; -webkit-flex-shrink: 0; flex-shrink: 0; }
li.done { color: #677765; text-decoration: line-through; }
li.done .dot { background: #c99a5f; border-color: #c99a5f; }
#todoEmpty { font-size: 17px; color: #677765; padding: 6px 0; }
#todoForm { margin: 12px 0 0; display: -webkit-box; display: -webkit-flex; display: flex; }
#todoInput { -webkit-box-flex: 1; -webkit-flex: 1 1 auto; flex: 1 1 auto; min-width: 0;
  font-size: 17px; font-family: inherit; color: #efe9de; background: #12211a;
  border: 1px solid #33503e; border-radius: 10px; padding: 9px 12px;
  -webkit-appearance: none; outline: none; }
#todoAdd { margin-left: 8px; font-size: 22px; line-height: 1; width: 44px;
  color: #172a1f; background: #c99a5f; border: 0; border-radius: 10px;
  -webkit-appearance: none; font-family: inherit; }
#todoClear { display: none; margin-top: 8px; font-size: 14px; color: #8a9a88;
  background: none; border: 0; padding: 4px 0; text-align: left; font-family: inherit;
  -webkit-appearance: none; }

/* Nachtmodus: dimmt alles zwischen 23 und 5 Uhr */
#dim { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #000;
  opacity: 0; pointer-events: none; -webkit-transition: opacity 2s; transition: opacity 2s; }
body.night #dim { opacity: 0.6; }

/* Hochformat */
#app.portrait { -webkit-box-orient: vertical; -webkit-flex-direction: column; flex-direction: column; padding: 30px 28px; }
#app.portrait #left { -webkit-box-flex: 0; -webkit-flex: 0 0 auto; flex: 0 0 auto; }
#app.portrait #right { margin-left: 0; margin-top: 18px; -webkit-box-flex: 1; -webkit-flex: 1 1 auto; flex: 1 1 auto; }
#app.portrait #clock { font-size: 168px; }
#app.portrait #quoteCard { margin-top: 22px; }
</style>
</head>
<body>
<div id="app">
  <div id="left" class="col">
    <div id="clock">--:--</div>
    <div id="date">&nbsp;</div>
    <div id="quoteCard" class="card">
      <div class="label">Zitat des Tages</div>
      <div id="quoteText"></div>
      <div id="quoteBy"></div>
    </div>
  </div>
  <div id="right" class="col">
    <div id="wordCard" class="card">
      <div class="label">Wort des Tages</div>
      <div id="word"></div>
      <div id="wordType"></div>
      <div id="wordMeaning"></div>
      <div id="wordExample"></div>
    </div>
    <div id="todoCard" class="card grow">
      <div class="label">Erinnerungen</div>
      <ul id="todoList"></ul>
      <div id="todoEmpty">Nichts offen.</div>
      <button id="todoClear" type="button">Erledigte entfernen</button>
      <form id="todoForm" autocomplete="off">
        <input id="todoInput" type="text" placeholder="Neue Erinnerung …" maxlength="80">
        <button id="todoAdd" type="submit">+</button>
      </form>
    </div>
  </div>
</div>
<div id="dim"></div>

(function () {
  "use strict";

  var DAYS = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
  var MONTHS = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli",
                "August", "September", "Oktober", "November", "Dezember"];
  var NIGHT_FROM = 23, NIGHT_TO = 5;   // Nachtmodus von 23:00 bis 4:59
  var STORE_KEY = "dashboard.todos.v1";

  function $(id) { return document.getElementById(id); }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function setText(el, txt) { el.textContent = txt; }

  // Tagesnummer seit 1970 (lokales Datum) – bestimmt Wort und Zitat
  function dayNumber(d) {
    return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
  }

  var lastDay = -1;

  function renderDaily(now) {
    var n = dayNumber(now);
    if (n === lastDay) { return; }
    lastDay = n;

    setText($("date"), "");
    var b = document.createElement("b");
    b.textContent = DAYS[now.getDay()];
    $("date").appendChild(b);
    $("date").appendChild(document.createTextNode(", " + now.getDate() + ". " +
      MONTHS[now.getMonth()] + " " + now.getFullYear()));

    if (WORDS.length) {
      var w = WORDS[n % WORDS.length];
      setText($("word"), w[0]);
      setText($("wordType"), w[1]);
      setText($("wordMeaning"), w[2]);
      setText($("wordExample"), w[3]);
    }

    if (QUOTES.length) {
      var q = QUOTES[n % QUOTES.length];
      var qt = $("quoteText");
      setText(qt, "„" + q[0] + "“");
      qt.className = q[0].length > 125 ? "xlong" : (q[0].length > 85 ? "long" : "");
      var by = $("quoteBy");
      setText(by, "– " + q[1]);
      if (q[2]) {
        var s = document.createElement("span");
        s.textContent = " · " + q[2];
        by.appendChild(s);
      }
    }
  }

  function tick() {
    var now = new Date();
    setText($("clock"), pad(now.getHours()) + ":" + pad(now.getMinutes()));
    renderDaily(now);
    var h = now.getHours();
    var night = (h >= NIGHT_FROM || h < NIGHT_TO);
    document.body.className = night ? "night" : "";
    setTimeout(tick, 1000 - now.getMilliseconds() + 20);
  }

  // Hoch-/Querformat
  function layout() {
    var portrait = window.innerHeight > window.innerWidth;
    $("app").className = portrait ? "portrait" : "";
  }

  // ---------- Erinnerungen (werden nur auf diesem iPad gespeichert) ----------
  var todos = [];

  function load() {
    try {
      var raw = window.localStorage.getItem(STORE_KEY);
      todos = raw ? JSON.parse(raw) : [];
      if (!(todos instanceof Array)) { todos = []; }
    } catch (e) { todos = []; }
  }
  function save() {
    try { window.localStorage.setItem(STORE_KEY, JSON.stringify(todos)); } catch (e) {}
  }

  function renderTodos() {
    var list = $("todoList");
    while (list.firstChild) { list.removeChild(list.firstChild); }
    var anyDone = false;
    for (var i = 0; i < todos.length; i++) {
      var li = document.createElement("li");
      if (todos[i].done) { li.className = "done"; anyDone = true; }
      li.setAttribute("data-i", i);
      var dot = document.createElement("span");
      dot.className = "dot";
      li.appendChild(dot);
      li.appendChild(document.createTextNode(todos[i].text));
      list.appendChild(li);
    }
    $("todoEmpty").style.display = todos.length ? "none" : "block";
    $("todoClear").style.display = anyDone ? "block" : "none";
  }

  function initTodos() {
    load();
    renderTodos();

    $("todoList").addEventListener("click", function (e) {
      var el = e.target;
      while (el && el.tagName !== "LI") { el = el.parentNode; }
      if (!el) { return; }
      var i = parseInt(el.getAttribute("data-i"), 10);
      if (todos[i]) { todos[i].done = !todos[i].done; save(); renderTodos(); }
    }, false);

    $("todoForm").addEventListener("submit", function (e) {
      e.preventDefault();
      var input = $("todoInput");
      var text = input.value.replace(/^\s+|\s+$/g, "");
      if (text) {
        todos.push({ text: text, done: false });
        save(); renderTodos();
      }
      input.value = "";
      input.blur();
    }, false);

    $("todoClear").addEventListener("click", function () {
      var keep = [];
      for (var i = 0; i < todos.length; i++) { if (!todos[i].done) { keep.push(todos[i]); } }
      todos = keep; save(); renderTodos();
    }, false);
  }

  // Seite soll nicht wackeln/scrollen – außer in der Erinnerungsliste
  document.addEventListener("touchmove", function (e) {
    var el = e.target;
    while (el) { if (el.id === "todoList") { return; } el = el.parentNode; }
    e.preventDefault();
  }, false);

  window.addEventListener("resize", layout, false);
  window.addEventListener("orientationchange", function () { setTimeout(layout, 300); }, false);

  layout();
  initTodos();
  tick();
})();
</script>
</body>
</html>
